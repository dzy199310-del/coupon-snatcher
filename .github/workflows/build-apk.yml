name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Locate Gradle project
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
          else
            D=$(find . -maxdepth 3 $ -name settings.gradle.kts -o -name settings.gradle $ | head -1 | xargs -r dirname)
            if [ -z "$D" ]; then D="."; fi
            echo "BUILD_DIR=$D" >> "$GITHUB_ENV"
          fi
          echo "Resolved BUILD_DIR=$BUILD_DIR"

      - name: Assemble
        run: |
          cd "$GITHUB_WORKSPACE/$BUILD_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/app-debug.apk
